<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quarterly sales — repaired fixture</title>
    <link rel="stylesheet" href="style.css" />
    <script src="charts.js" defer></script>
  </head>
  <body data-mode="repaired">
    <main id="main">
      <h1>Quarterly sales</h1>
      <p>Local test fixture using synthetic data. Variant: repaired.</p>
      <section data-case="charts">
        <label for="quarter">Quarter</label
        ><select id="quarter">
          <option value="q1">Q1</option>
          <option value="q2">Q2</option>
          <option value="empty">No data</option>
        </select>
        <figure>
          <svg
            id="sales-chart"
            viewBox="0 0 400 160"
            role="img"
            aria-labelledby="chart-title chart-description"
          >
            <title id="chart-title">Sales in Q1</title>
            <desc id="chart-description">
              Sales in units for Apples and Pears. Exact values are in the
              following table.
            </desc>
            <g id="bars"></g>
          </svg>
          <figcaption id="chart-summary"></figcaption>
        </figure>
        <table>
          <caption id="data-caption">
            Sales in Q1, units
          </caption>
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Units sold</th>
            </tr>
          </thead>
          <tbody id="sales-data"></tbody>
        </table>
        <p id="chart-status" role="status"></p>
      </section>
    </main>
  </body>
</html>
