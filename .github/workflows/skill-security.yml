name: Skill security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-security.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install cisco-ai-skill-scanner==2.0.14
      - name: Run local non-LLM analyzers
        run: >-
          skill-scanner scan-all skills --recursive --use-behavioral
          --fail-on-severity high --format sarif --output skill-security.sarif
      - name: Preserve SARIF report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skill-security-sarif
          path: skill-security.sarif
          if-no-files-found: error
      - name: Publish public-repository code-scanning results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: skill-security.sarif
